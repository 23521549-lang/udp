<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>UDP Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232B5BE0%27/%3E%3Crect x=%275%27 y=%279.5%27 width=%2722%27 height=%2713%27 rx=%276.5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.8%27/%3E%3Ccircle cx=%2720.5%27 cy=%2716%27 r=%273.8%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Hallmark · genre: modern-minimal · studied: yes (Linear app shell, Stripe charts) · paper oklch(96.6% .003 275) · accent oklch(55% .15 277) · Geist + Geist Mono */
:root{
  --bg:oklch(96.6% .003 275); --panel:oklch(99.7% .001 275); --raised:oklch(100% 0 0); --sunk:oklch(97.4% .003 275); --hover:oklch(96% .004 275); --active:oklch(94.2% .006 275);
  --line:oklch(92.6% .004 275); --line-2:oklch(88.5% .006 275);
  --ink:oklch(21% .012 275); --ink-2:oklch(44% .012 275); --ink-3:oklch(60% .01 275); --ink-4:oklch(72% .008 275);
  --accent:oklch(54% .2 262); --accent-2:oklch(48% .2 262); --accent-soft:oklch(95.6% .028 262); --accent-tint:oklch(97.6% .014 262); --on-accent:oklch(99% .005 262);
  --green:oklch(60% .14 152); --amber:oklch(72% .15 72); --red:oklch(58% .19 25); --red-soft:oklch(96.5% .02 25); --amber-soft:oklch(96.8% .035 80); --green-soft:oklch(96.5% .03 152); --green-ink:oklch(44% .12 152); --amber-ink:oklch(50% .12 62); --red-ink:oklch(48% .17 25);
  --v1:oklch(54% .2 262); --v2:oklch(78% .02 275); --v3:oklch(70% .13 200); --v4:oklch(62% .14 310);
  --console-bg:oklch(21% .03 262); --console-raised:oklch(26% .035 262); --console-line:oklch(31% .035 262); --console-ink:oklch(95% .01 262); --console-ink-2:oklch(72% .025 262); --console-active:oklch(34% .07 262);
  --shadow-panel:0 0 0 1px var(--line),0 1px 2px oklch(20% .01 275 / .04),0 6px 16px oklch(20% .01 275 / .03);
  --shadow-pop:0 0 0 1px var(--line),0 8px 24px oklch(20% .01 275 / .12),0 2px 6px oklch(20% .01 275 / .06);
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:oklch(16.5% .004 275); --panel:oklch(19.5% .005 275); --raised:oklch(22.5% .006 275); --sunk:oklch(18% .005 275); --hover:oklch(23% .006 275); --active:oklch(26% .008 275);
  --line:oklch(26.5% .006 275); --line-2:oklch(32% .008 275);
  --ink:oklch(95% .004 275); --ink-2:oklch(76% .008 275); --ink-3:oklch(60% .008 275); --ink-4:oklch(46% .008 275);
  --accent:oklch(66% .17 258); --accent-2:oklch(72% .15 258); --accent-soft:oklch(28% .07 260); --accent-tint:oklch(23% .04 260); --on-accent:oklch(15% .03 262);
  --green:oklch(72% .15 152); --amber:oklch(80% .14 75); --red:oklch(68% .18 25); --red-soft:oklch(27% .05 25); --amber-soft:oklch(28% .04 75); --green-soft:oklch(27% .04 152); --green-ink:oklch(84% .12 152); --amber-ink:oklch(87% .11 80); --red-ink:oklch(82% .12 25);
  --v1:oklch(66% .17 258); --v2:oklch(45% .01 275); --v3:oklch(72% .12 200); --v4:oklch(72% .12 310);
  --shadow-panel:0 0 0 1px var(--line),0 1px 2px oklch(0% 0 0 / .3);
  --shadow-pop:0 0 0 1px var(--line-2),0 12px 32px oklch(0% 0 0 / .5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.c2{color:var(--ink-2)}.c3{color:var(--ink-3)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
kbd{font-family:var(--sans);font-size:11px;min-width:18px;height:18px;padding:0 4px;display:inline-grid;place-items:center;border-radius:4px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3)}

/* ---------- khung ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh;padding:8px 8px 8px 0}
.side{display:flex;flex-direction:column;gap:2px;padding:6px 10px 10px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;margin-bottom:6px}
.ws:hover{background:var(--hover)}
.mark{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px}
.ws b{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.ws .ch{margin-left:auto;color:var(--ink-3)}
.searchbtn{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:6px 8px;border-radius:7px;color:var(--ink-3);margin-bottom:8px}
.searchbtn:hover{background:var(--hover);color:var(--ink-2)}
.searchbtn kbd{margin-left:auto}
.nv{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:7px;color:var(--ink-2);font-weight:500;transition:background .12s}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nv[aria-current="page"] .n{color:var(--accent-2)}
:root[data-theme="dark"] .nv[aria-current="page"]{color:var(--accent-2)}
.tile{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile svg.i{width:17px;height:17px;stroke-width:1.7}
.mhead{display:flex;align-items:center;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.mhead h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.2}
.mhead p{margin:2px 0 0;color:var(--ink-2)}
.mhead .acts{margin-left:auto;display:flex;gap:6px}
.minis{display:flex;gap:22px;margin-left:auto;padding-right:6px}
.minis div{display:flex;flex-direction:column;align-items:flex-end}
.minis b{font-size:18px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.minis span{font-size:11.5px;color:var(--ink-3)}
.nv .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp{font-size:11.5px;font-weight:500;color:var(--ink-3);padding:14px 8px 4px;display:flex;align-items:center}
/* moi truong: moi moi truong mot icon + mot mau, dung chung o moi noi */
:root{--env-dev:oklch(56% .06 255);--env-dev-soft:oklch(95.5% .012 255);--env-staging:oklch(66% .15 62);--env-staging-soft:oklch(96.2% .035 75);--env-production:oklch(57% .15 152);--env-production-soft:oklch(95.8% .035 152)}
:root[data-theme="dark"]{--env-dev:oklch(72% .06 255);--env-dev-soft:oklch(27% .02 255);--env-staging:oklch(78% .14 70);--env-staging-soft:oklch(28% .04 70);--env-production:oklch(72% .15 152);--env-production-soft:oklch(27% .04 152)}
.es{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px oklch(0% 0 0 / .12)}
.es.dev{background:var(--env-dev)}.es.staging{background:var(--env-staging)}.es.production{background:var(--env-production)}
/* bo chon moi truong tren thanh dau trang (Railway, LaunchDarkly, Vercel) */
.envsw{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 10px;border-radius:7px;font-weight:500;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--raised);transition:background .12s}
.envsw:hover{background:var(--hover)}
.envsw .ch{color:var(--ink-3);display:grid}
.envsw .ch svg.i{width:14px;height:14px}
.envsw .lk{color:var(--ink-3);display:grid}
.envsw .lk svg.i{width:12px;height:12px}
.envpop{position:fixed;z-index:35;width:300px;background:var(--raised);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.envpop .q{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;margin-bottom:4px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3)}
.envpop .q:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--accent-soft)}
.envpop .q input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.envpop .op{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;border-radius:7px;text-align:left}
.envpop .op[aria-selected="true"]{background:var(--active)}
.envpop .op .nm{font-weight:500;line-height:1.2}
.envpop .op .nm{min-width:0}
.envpop .op .nm small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.envpop .op .r{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.envpop .op .r svg.i{width:14px;height:14px;color:var(--accent)}
.envpop .op .nm svg.i{width:12px;height:12px}
.envpop .ft{border-top:1px solid var(--line);margin-top:4px;padding:8px 8px 4px;font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.ni{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 1px oklch(20% .01 275 / .04);color:var(--ink-2);flex:none;transition:background .12s,color .12s}
.ni svg.i{width:14px;height:14px;stroke-width:1.9}
.nv[aria-current="page"] .ni{background:var(--accent);color:var(--on-accent);box-shadow:0 1px 3px oklch(45% .2 262 / .35)}
.nv:hover .ni{color:var(--ink)}
.envcard{margin:2px 0 4px;padding:4px;border-radius:10px;background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 2px oklch(20% .01 275 / .04);display:flex;flex-direction:column;gap:2px}
.envrow{position:relative;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:9px;padding:6px 7px;border-radius:7px;text-align:left;transition:background .12s}
.envrow .node{display:grid;place-items:center;position:relative;z-index:1}
.envrow:not(:last-child)::after{content:"";position:absolute;left:16.5px;top:calc(50% + 7px);height:calc(100% - 10px);width:1px;background:var(--line-2)}
.envrow:hover{background:var(--hover)}
.envrow .nm{font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:5px;line-height:1.2}
.envrow .nm svg.i{width:12px;height:12px;color:var(--ink-3)}
.envrow .sub{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.envrow>span:nth-child(2){min-width:0}
.envrow .vv{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.envrow[aria-pressed="true"].dev{background:var(--env-dev-soft)}.envrow[aria-pressed="true"].staging{background:var(--env-staging-soft)}.envrow[aria-pressed="true"].production{background:var(--env-production-soft)}
.envrow[aria-pressed="true"] .nm{color:var(--ink);font-weight:600}
.live{width:7px;height:7px;border-radius:50%;background:var(--env-production);box-shadow:0 0 0 0 var(--env-production);animation:live 2s var(--ease) infinite}
@keyframes live{70%{box-shadow:0 0 0 5px oklch(57% .15 152 / 0)}100%{box-shadow:0 0 0 0 oklch(57% .15 152 / 0)}}
.rorow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--ink-2)}
.rorow:hover{background:var(--hover);color:var(--ink)}
.rorow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rorow .bar3{grid-column:1/3;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:-2px}
.rorow .bar3 i{display:block;height:100%;background:var(--accent)}
.rorow .bar3 i.paused{background:var(--amber)}
.rorow .pc{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.envdot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--bg)}
.nv .envdot{box-shadow:none}
.e-dev{background:var(--ink-4)}.e-staging{background:var(--amber)}.e-production{background:var(--green)}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--on-accent);flex:none}
.main{background:var(--panel);border-radius:10px;box-shadow:var(--shadow-panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;font-weight:500;min-width:0}
.crumbs a{color:var(--ink-3)}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-4)}
.crumbs b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.body{flex:1;min-height:0;display:flex}
.scroll{flex:1;min-width:0;overflow:auto}
.ib.menubtn{display:none}
.envtabs button.sw{height:16px;width:28px;padding:0;margin-left:auto;align-self:center}
.envtabs button.sw::after{content:"";position:absolute;left:2px;right:auto;bottom:auto;top:2px;height:12px;width:12px;border-radius:50%;background:var(--raised)}

/* nút */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-weight:500;color:var(--ink);background:var(--raised);box-shadow:0 0 0 1px var(--line-2),0 1px 1px oklch(20% .01 275 / .04);white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 oklch(100% 0 0 / .15),0 1px 2px oklch(30% .1 277 / .3)}
.btn.pri:hover{background:var(--accent-2)}
.btn.danger{color:var(--red)}
.btn.danger-fill{background:var(--red);color:oklch(99% .005 25);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd{margin-left:2px;background:transparent;box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .3);color:inherit;opacity:.8}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:disabled{opacity:.3;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip.soft{box-shadow:none;background:var(--sunk)}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:24px;padding:0 9px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px oklch(20% .01 275 / .06)}

/* ---------- danh sách kiểu Linear ---------- */
.filters{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 18px;border-bottom:1px solid var(--line)}
.filters .q{display:flex;align-items:center;gap:6px;color:var(--ink-3);flex:1;max-width:320px;height:28px;padding:0 8px;border-radius:6px}
.filters .q:focus-within{background:var(--sunk)}
.filters .q input{border:0;outline:0;background:none;width:100%;color:var(--ink)}
.gh{display:flex;align-items:center;gap:8px;height:36px;padding:0 18px;background:var(--sunk);border-bottom:1px solid var(--line);font-weight:500;position:sticky;top:0;z-index:2}
.gh .n{color:var(--ink-3);font-weight:400}
.row{display:grid;grid-template-columns:18px minmax(160px,1.4fr) minmax(120px,1fr) 108px 80px 64px 26px;align-items:center;gap:12px;height:44px;padding:0 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--active)}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.envs{display:flex;gap:4px}
.envs span{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.pip{width:18px;height:6px;border-radius:3px;background:var(--line-2)}
.pip.on{background:var(--green)}
.row .when{color:var(--ink-3);font-size:12px;text-align:right}
.spark{display:block}

/* ---------- peek ---------- */
.peek{width:min(520px,48%);flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel);animation:slide .22s var(--ease)}
@keyframes slide{from{transform:translateX(16px);opacity:0}}
.peek .ph{display:flex;align-items:center;gap:6px;height:46px;padding:0 10px 0 18px;border-bottom:1px solid var(--line);flex:none}
.peek .inner{overflow:auto;padding:20px 22px 90px}
.title{font-size:22px;font-weight:650;letter-spacing:-.025em;margin:0 0 4px;line-height:1.2}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:62ch}
.props{display:grid;grid-template-columns:110px 1fr;gap:2px 12px;margin-bottom:22px}
.props dt{color:var(--ink-3);height:30px;display:flex;align-items:center}
.props dd{margin:0;height:30px;display:flex;align-items:center;gap:6px;min-width:0}
.sect{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sect h3{margin:0;font-size:13px;font-weight:600}
.sect .r{margin-left:auto;display:flex;gap:6px}
.envtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.envtabs button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;color:var(--ink-3);font-weight:500;position:relative}
.envtabs button[aria-selected="true"]{color:var(--ink)}
.envtabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.envtabs .sw{margin-left:auto;align-self:center}
.sw{position:relative;width:28px;height:16px;border-radius:16px;background:var(--line-2);transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px oklch(0% 0 0 / .25);transition:transform .15s var(--ease)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(12px)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.rule{border-radius:8px;box-shadow:0 0 0 1px var(--line);background:var(--raised);margin-bottom:8px}
.rule-h{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line)}
.rule-h .idx{width:18px;height:18px;border-radius:5px;background:var(--sunk);display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-weight:500;flex:none}
.rule-h input{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:500;height:26px}
.rule-b{padding:10px 12px;display:grid;grid-template-columns:40px 1fr;gap:8px 8px;align-items:center}

/* vòng trạng thái kiểu Linear: độ phủ = % production nhận variant đầu tiên */
/* vong tien do net manh: ranh xam + cung mau dai dung bang % (khong to dac) */
function arc(p,col,size){
  const R=5.25,C=2*Math.PI*R;
  return `<svg class="arc" width="${size}" height="${size}" viewBox="0 0 14 14" style="flex:none"><circle cx="7" cy="7" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="1.6"/>${p>0?`<circle cx="7" cy="7" r="${R}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="${Math.max(.01,p*C-0.01).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 7 7)"/>`:""}</svg>`;
}
const stIcon=(ic,col,size)=>`<span style="display:inline-grid;color:${col};flex:none">${ic.replace('class="i"',`class="i" style="width:${size+1}px;height:${size+1}px;stroke-width:1.75"`)}</span>`;
function ring(f,size=14){
  const x=f.env.production,p=f.status==="DRAFT"?0:(x.mix[f.vars[0].k]||0)/100;
  if(f.status==="DRAFT")return `<svg width="${size}" height="${size}" viewBox="0 0 14 14" aria-label="Nháp" style="flex:none"><circle cx="7" cy="7" r="5.25" fill="none" stroke="var(--ink-4)" stroke-width="1.6" stroke-dasharray="1.5 2.2"/></svg>`;
  return `<span aria-label="${Math.round(p*100)}% ở production" style="display:inline-flex">${arc(p,live(f)?"var(--accent)":"var(--ink-3)",size)}</span>`;
}
function roIcon(r,size=14){
  if(r.status==="ROLLED_BACK")return stIcon(I.cx,"var(--red)",size);
  if(r.status==="DONE")return stIcon(I.ok,"var(--green)",size);
  if(r.status==="PAUSED")return stIcon(I.cpause,"var(--amber)",size);
  return arc(pctOf(r)/100,"var(--accent)",size);
}
function spark(d,w=64,h=18){
  const mx=Math.max(1,...d),pts=d.map((v,i)=>`${(i/(d.length-1)*w).toFixed(1)},${(h-1-(v/mx)*(h-3)).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--ink-4)" stroke-width="1.25" stroke-linejoin="round"/></svg>`;
}

/* biểu đồ vùng mượt kiểu Stripe, có trỏ chuột xem số */
function drawChart(el,r,kind){
  const W=el.clientWidth||600,H=190,L=36,R=8,T=12,B=22,pw=W-L-R,ph=H-T-B;
  const d=kind==="err"?r.err:r.lat,b=kind==="err"?r.base:r.blat,lim=kind==="err"?r.p.err:r.p.lat,unit=kind==="err"?"%":" ms";
  let mx=Math.max(...d,...b,lim)*1.15;const mag=Math.pow(10,Math.floor(Math.log10(mx)));mx=Math.ceil(mx/mag*2)/2*mag;
  const x=i=>L+i*pw/(d.length-1),y=v=>T+ph-v/mx*ph;
  const smooth=a=>a.map((v,i)=>{if(!i)return `M${x(0)},${y(v)}`;const x0=x(i-1),x1=x(i),cx=(x0+x1)/2;return `C${cx},${y(a[i-1])} ${cx},${y(v)} ${x1},${y(v)}`;}).join("");
  const fmt=v=>kind==="err"?nf(v,v<10&&v%1?1:0):nf(v);
  const id="g"+kind+Math.random().toString(36).slice(2,6);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==="err"?"Tỉ lệ lỗi":"Độ trễ p99"} 4 phút gần nhất">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(mx*t)}" y2="${y(mx*t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(mx*t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--sans)">${fmt(mx*t)}</text>`).join("")}
    <line x1="${L}" x2="${W-R}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--red)" stroke-dasharray="3 4" opacity=".7"/>
    <path d="${smooth(d)}L${x(d.length-1)},${T+ph}L${L},${T+ph}Z" fill="url(#${id})"/>
    <path d="${smooth(b)}" fill="none" stroke="var(--ink-4)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <path d="${smooth(d)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${[["4 phút trước",0,"start"],["2 phút trước",(d.length-1)/2,"middle"],["Bây giờ",d.length-1,"end"]].map(t=>`<text x="${x(t[1])}" y="${H-4}" text-anchor="${t[2]}" font-size="11" fill="var(--ink-3)" font-family="var(--sans)">${t[0]}</text>`).join("")}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--line-2)" opacity="0"/><circle class="dot" r="4" fill="var(--raised)" stroke="var(--accent)" stroke-width="2" opacity="0"/>
    <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" class="hit"/>
  </svg><div class="tip"></div>`;
  const svg=$("svg",el),tip=$(".tip",el),xh=$(".xh",el),dot=$(".dot",el);
  $(".hit",el).addEventListener("pointermove",ev=>{const rc=svg.getBoundingClientRect(),sx=(ev.clientX-rc.left)*W/rc.width,i=Math.max(0,Math.min(d.length-1,Math.round((sx-L)/pw*(d.length-1))));
    xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.setAttribute("opacity",1);dot.setAttribute("cx",x(i));dot.setAttribute("cy",y(d[i]));dot.setAttribute("opacity",1);
    const secs=(d.length-1-i)*10;tip.style.opacity=1;tip.style.left=(x(i)/W*100)+"%";tip.style.top=(y(d[i])-12)+"px";
    tip.innerHTML=`<div class="c3" style="margin-bottom:4px">${secs?secs+" giây trước":"Bây giờ"}</div><div class="r2"><span class="lg"><i style="background:var(--accent)"></i>Canary</span><b>${fmt(d[i])}${unit}</b></div><div class="r2"><span class="lg"><i style="background:var(--ink-4)"></i>Ổn định</span><b>${fmt(b[i])}${unit}</b></div>`;});
  $(".hit",el).addEventListener("pointerleave",()=>{tip.style.opacity=0;xh.setAttribute("opacity",0);dot.setAttribute("opacity",0);});
}

  const act=$('[data-act="activate"]');if(act)act.onclick=()=>{f.status="ACTIVE";render();toast("Đã kích hoạt "+f.key,()=>{f.status="DRAFT";render();});};
  const cc=$("[data-copycode]");if(cc)cc.onclick=()=>{navigator.clipboard?.writeText($("#snip").innerText).catch(()=>{});toast("Đã chép code");};
  const dc=$("[data-discard]");if(dc)dc.onclick=()=>{const k=f.key+"|"+S.env;f.env[S.env]=clone(S.saved[k]);delete S.saved[k];render();};
  const sv=$("[data-save]");if(sv)sv.onclick=()=>save(f);
}
function save(f){
  const k=f.key+"|"+S.env;if(!S.saved[k]||invalid(f))return;
  const x=f.env[S.env],r=x.rules.find(q=>q.cond.kind==="ALL");if(r)x.mix=r.serve.split?clone(r.serve.split):{[r.serve.v]:100};
  const prev=S.saved[k];delete S.saved[k];render();toast(`Đã lưu, ứng dụng nhận trong khoảng 1 giây`,()=>{f.env[S.env]=prev;render();});
}
function bindRollout(r){
  $$("[data-ra]").forEach(b=>b.onclick=()=>{const a=b.dataset.ra;
    if(a==="pause"){r.status="PAUSED";r.log.unshift([nowT(),"an.nguyen tạm dừng","",I.pause]);render();toast("Đã tạm dừng ở "+pctOf(r)+"%",()=>{r.status="RUNNING";r.log.shift();render();});}
    if(a==="resume"){r.status="RUNNING";r.left=Math.min(30,r.p.dwell);r.log.unshift([nowT(),"an.nguyen tiếp tục","",I.play]);render();toast("Đã tiếp tục");}
    if(a==="promote")modal(`<div class="mh"><h2 id="mT">Lên 100% ngay?</h2><p>Bỏ qua các bậc còn lại. Toàn bộ người dùng nhận bản mới và phân tích sức khoẻ dừng lại.</p></div><div class="mf"><button class="btn" data-x>Huỷ</button><button class="btn pri" id="mok">Lên 100%</button></div>`,()=>{r.idx=r.steps.length-1;r.status="DONE";r.log.unshift([nowT(),"Lên 100%","an.nguyen",I.check]);sync(r);closeModal();render();toast("Đã gửi lệnh lên 100%");});
    if(a==="rollback")modal(`<div class="mh"><h2 id="mT">Rollback ${esc(r.name)}?</h2><p>Traffic canary về 0% và toàn bộ người dùng quay lại bản ổn định. Rollout kết thúc, không tiếp tục được.</p></div><div class="mb"><div class="f"><label for="mc">Lý do</label><textarea class="inp" id="mc" rows="2" placeholder="Không bắt buộc"></textarea></div></div><div class="mf"><button class="btn" data-x>Huỷ</button><button class="btn danger-fill" id="mok">Rollback</button></div>`,()=>{r.status="ROLLED_BACK";r.failAt=r.idx;r.why=null;r.log.unshift([nowT(),"Rollback thủ công",$("#mc").value||"an.nguyen",I.undo]);sync(r);closeModal();render();toast("Đã rollback, traffic về 0%");});
  });
}
function sync(r){const f=F(r.flag);if(!f)return;const pc=pctOf(r);f.env.production.mix={on:pc,off:100-pc};const rl=f.env.production.rules.find(q=>q.serve.split);if(rl)rl.serve.split={on:pc,off:100-pc};}
function openEnv(btn){
  closeEnv();
  const r=btn.getBoundingClientRect(),pop=document.createElement("div");
  pop.className="envpop";pop.id="envPop";pop.setAttribute("role","dialog");pop.setAttribute("aria-label","Chọn môi trường");
  pop.style.left=Math.max(8,Math.min(r.left,innerWidth-288))+"px";pop.style.top=(r.bottom+6)+"px";
  pop.innerHTML=`<label class="q">${I.search}<input id="envQ" placeholder="Tìm môi trường" aria-label="Tìm môi trường"></label><div id="envL" role="listbox"></div><div class="ft"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> đổi nhanh ở mọi màn hình</div>`;
  document.body.appendChild(pop);
  let sel=ENVS.indexOf(S.env),list=ENVS.slice();
  const draw=()=>{const v=$("#envQ").value.toLowerCase();list=ENVS.filter(e=>e.includes(v));sel=Math.min(sel,Math.max(0,list.length-1));
    $("#envL").innerHTML=list.map((e,i)=>`<button class="op" role="option" data-e="${e}" aria-selected="${i===sel}">${et(e)}<span class="nm"><span style="display:inline-flex;align-items:center;gap:5px">${e}${e==="production"?`<span class="c3" style="display:grid">${I.lock}</span>`:""}</span><small>${ENV_META[e].sub}</small></span><span class="r"><span class="mono">v${ENV_META[e].v}</span>${e===S.env?I.check:""}</span></button>`).join("")||`<div class="c3" style="padding:10px 8px">Không có môi trường nào khớp</div>`;
    $$("#envL .op").forEach(b=>{b.onclick=()=>pick(b.dataset.e);b.onmousemove=()=>{sel=list.indexOf(b.dataset.e);$$("#envL .op").forEach(x=>x.setAttribute("aria-selected",x===b));};});};
  const pick=e=>{closeEnv();if(e!==S.env){S.env=e;render();toast("Đang xem "+e);}};
  $("#envQ").oninput=draw;
  $("#envQ").onkeydown=ev=>{if(ev.key==="ArrowDown"){ev.preventDefault();sel=Math.min(list.length-1,sel+1);draw();}
    if(ev.key==="ArrowUp"){ev.preventDefault();sel=Math.max(0,sel-1);draw();}
    if(ev.key==="Enter"&&list[sel])pick(list[sel]);if(ev.key==="Escape"){closeEnv();btn.focus();}};
  draw();setTimeout(()=>$("#envQ").focus(),10);
}
function closeEnv(){const p=$("#envPop");if(p)p.remove();}
document.addEventListener("mousedown",e=>{const p=$("#envPop");if(p&&!p.contains(e.target)&&!e.target.closest("#envSw"))closeEnv();});
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";try{localStorage.setItem("udp-theme",S.theme);}catch(e){}render();}

/* ---------- Ctrl K ---------- */
let palItems=[],palSel=0;
function openPal(){
  const pal=$("#pal");
  pal.innerHTML=`<div class="in">${I.search}<input id="pq" placeholder="Tìm flag, rollout hoặc gõ lệnh" aria-label="Tìm"><kbd>Esc</kbd></div><div class="ls" id="pl" role="listbox"></div><div class="ft"><span><kbd>↑</kbd><kbd>↓</kbd> chọn</span><span><kbd>Enter</kbd> mở</span></div>`;
  pal.classList.add("on");$("#scrim").classList.add("on");
  const all=[
    ...S.flags.map(f=>({g:"Flag",l:f.name,h:f.key,ic:ring(f),run:()=>go("/flags",{key:f.key})})),
    ...S.rollouts.map(r=>({g:"Rollout",l:r.name,h:pctOf(r)+"%",ic:roIcon(r),run:()=>go("/rollouts",{id:r.id})})),
    {g:"Lệnh",l:"Tạo flag",h:"C",ic:I.plus,run:newFlag},{g:"Lệnh",l:"Tạo rollout",h:"",ic:I.ramp,run:newRollout},
    ...ENVS.map(e=>({g:"Lệnh",l:"Chuyển sang "+e,h:"",ic:et(e,false),run:()=>{S.env=e;render();}})),
    {g:"Lệnh",l:S.theme==="dark"?"Giao diện sáng":"Giao diện tối",h:"",ic:S.theme==="dark"?I.sun:I.moon,run:toggleTheme}];
  const draw=()=>{const v=$("#pq").value.toLowerCase();palItems=all.filter(i=>(i.l+" "+i.h).toLowerCase().includes(v));palSel=Math.min(palSel,Math.max(0,palItems.length-1));
    let g="";$("#pl").innerHTML=palItems.map((it,i)=>(it.g!==g?`<div class="gl">${g=it.g}</div>`:"")+`<button class="op" role="option" data-i="${i}" aria-selected="${i===palSel}">${it.ic}<span>${esc(it.l)}</span><span class="h">${it.h&&it.h.length<3?`<kbd>${it.h}</kbd>`:esc(it.h)}</span></button>`).join("")||`<div class="gl">Không có kết quả</div>`;
    $$("#pl .op").forEach(b=>{b.onclick=()=>{closePal();palItems[+b.dataset.i].run();};b.onmousemove=()=>{if(palSel!==+b.dataset.i){palSel=+b.dataset.i;$$("#pl .op").forEach(x=>x.setAttribute("aria-selected",x===b));}};});};
  $("#pq").oninput=()=>{palSel=0;draw();};
  $("#pq").onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);draw();$('#pl [aria-selected="true"]')?.scrollIntoView({block:"nearest"});}
    if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);draw();$('#pl [aria-selected="true"]')?.scrollIntoView({block:"nearest"});}
    if(e.key==="Enter"&&palItems[palSel]){closePal();palItems[palSel].run();}};
  draw();setTimeout(()=>$("#pq").focus(),20);
}
function closePal(){$("#pal").classList.remove("on");if(!$("#modal.on"))$("#scrim").classList.remove("on");}

/* ---------- modal, toast ---------- */
function modal(html,ok){const m=$("#modal");m.innerHTML=html;m.classList.add("on");$("#scrim").classList.add("on");$$("[data-x]",m).forEach(b=>b.onclick=closeModal);if(ok)$("#mok").onclick=ok;setTimeout(()=>{const t=$("input,textarea",m)||$("#mok");t&&t.focus();},40);}
function closeModal(){$("#modal").classList.remove("on");if(!$("#pal.on"))$("#scrim").classList.remove("on");}
$("#scrim").onclick=()=>{closeModal();closePal();$("#side").classList.remove("open");};
function toast(msg,undo){
  const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>Hoàn tác</button>`:""}`;
  $("#toasts").innerHTML="";$("#toasts").appendChild(t);
  if(undo)$("button",t).onclick=()=>{t.remove();undo();};
  setTimeout(()=>t.remove(),undo?5000:2600);
}
const COMB=new RegExp("["+String.fromCharCode(0x300)+"-"+String.fromCharCode(0x36f)+"]","g");
const slug=s=>s.normalize("NFD").replace(COMB,"").replace(/[đĐ]/g,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
function newFlag(){
  let type="Boolean",touched=false;
  modal(`<div class="mh"><h2 id="mT">Tạo flag</h2><p>Flag mới ở dạng nháp, SDK chưa thấy cho tới khi kích hoạt.</p></div><div class="mb">
    <div class="f"><label for="n1">Tên</label><input class="inp" id="n1" placeholder="Thanh toán một trang" autocomplete="off"></div>
    <div class="f"><label for="n2">Key</label><input class="inp mono" id="n2" placeholder="thanh-toan-mot-trang" autocomplete="off"><span class="help" id="nh">Dùng trong code, không đổi được sau khi tạo.</span></div>
    <div class="f"><label>Kiểu</label><div class="opts">${[["Boolean","Bật hoặc tắt"],["String","Chọn một chuỗi"],["Number","Một con số"],["JSON","Cấu hình có cấu trúc"]].map(t=>`<button data-t="${t[0]}" aria-pressed="${t[0]===type}"><b>${t[0]}</b>${t[1]}</button>`).join("")}</div></div>
  </div><div class="mf"><button class="btn" data-x>Huỷ</button><button class="btn pri" id="mok" disabled>Tạo flag</button></div>`);
  const n=$("#n1"),k=$("#n2"),chk=()=>{const dup=!!F(k.value);$("#nh").textContent=dup?"Key này đã có trong dự án":"Dùng trong code, không đổi được sau khi tạo.";$("#nh").style.color=dup?"var(--red)":"";$("#mok").disabled=!n.value.trim()||k.value.length<2||dup;};
  n.oninput=()=>{if(!touched)k.value=slug(n.value);chk();};k.oninput=()=>{touched=true;k.value=k.value.toLowerCase().replace(/[^a-z0-9-]/g,"-");chk();};
  $$("[data-t]").forEach(b=>b.onclick=()=>{type=b.dataset.t;$$("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#mok").onclick=()=>{const key=k.value.replace(/-+$/,""),vars=type==="Boolean"?[{k:"on",v:"true"},{k:"off",v:"false"}]:[{k:"a",v:'"a"'},{k:"b",v:'"b"'}],e0=()=>({on:false,evals:0,mix:{[vars[1].k]:100},rules:[],fall:vars[1].k});
    S.flags.push({key,name:n.value.trim(),type,status:"DRAFT",desc:"Chưa có mô tả.",owner:ME,updated:"vừa xong",vars,off:vars[1].k,spark:Array(14).fill(0),env:{dev:e0(),staging:e0(),production:e0()}});
    closeModal();go("/flags",{key});toast("Đã tạo "+key);};
}
function newRollout(){
  let probed=false;
  const draw=()=>{modal(`<div class="mh"><h2 id="mT">Tạo rollout</h2><p>Tăng dần người dùng nhận bản mới, tự rollback khi metric vượt ngưỡng.</p></div><div class="mb">
    <div class="f"><label for="r1">Flag</label><select class="sel" id="r1">${S.flags.filter(f=>f.status==="ACTIVE"&&!live(f)).map(f=>`<option>${f.key}</option>`).join("")}</select></div>
    <div class="f"><label for="r2">Workload phát metric</label><select class="sel" id="r2"><option>checkout-api</option><option>search-api</option></select></div>
    <div class="lock" style="margin:0;${probed?"background:var(--green-soft)":""}">${probed?`<span style="color:var(--green)">${I.check}</span>`:I.info}<div style="flex:1">${probed?"Đã thấy metric của workload, đủ dữ liệu để phân tích.":"Cần kiểm tra metric của workload trước khi tạo."}</div>${probed?"":`<button class="btn" id="pb">Kiểm tra</button>`}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="f"><label for="r3">Các bậc</label><input class="inp num" id="r3" value="5, 10, 25, 50, 100"></div><div class="f"><label for="r4">Dừng mỗi bậc</label><select class="sel" id="r4"><option>30 giây</option><option selected>2 phút</option><option>5 phút</option></select></div></div>
  </div><div class="mf"><button class="btn" data-x>Huỷ</button><button class="btn pri" id="mok" ${probed?"":"disabled"}>Tạo rollout</button></div>`);
    const pb=$("#pb");if(pb)pb.onclick=()=>{pb.disabled=true;pb.textContent="Đang kiểm tra";setTimeout(()=>{probed=true;draw();},700);};
    $("#mok").onclick=()=>{closeModal();toast("Đã tạo rollout, bậc 5% bắt đầu khi thấy nhãn flag");};};
  draw();
}

/* ---------- phím tắt ---------- */
document.addEventListener("keydown",e=>{
  const typing=e.target.matches("input,textarea,select");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal.on")?closePal():openPal();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){const f=F(route().q.get("key"));if(f){e.preventDefault();save(f);}return;}
  if(e.key==="Escape"){if($("#pal.on"))closePal();else if($("#modal.on"))closeModal();else if(route().q.get("key"))go("/flags");return;}
  if(typing||$("#modal.on")||$("#pal.on"))return;
  if(["1","2","3"].includes(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){const env=ENVS[+e.key-1];if(env!==S.env){S.env=env;closeEnv();render();toast("Đang xem "+env);}return;}
  if(e.key==="c"&&route().p.startsWith("/flags")){e.preventDefault();newFlag();}
  if((e.key==="j"||e.key==="k")&&route().p.startsWith("/flags")){const rows=$$("[data-flag]").filter(r=>!r.hidden);if(!rows.length)return;const cur=rows.findIndex(r=>r.getAttribute("aria-selected")==="true");const n=e.key==="j"?Math.min(rows.length-1,cur+1):Math.max(0,cur-1);go("/flags",{key:rows[n].dataset.flag});}
});

/* ---------- số liệu sống ---------- */
setInterval(()=>{
  const r=RO("ro-checkout");if(r.status!=="RUNNING")return;
  const j=(v,s)=>Math.max(0,v+(Math.random()-.5)*s),push=(a,v)=>{a.push(v);a.shift();};
  push(r.err,+j(.4,.16).toFixed(2));push(r.base,+j(.32,.08).toFixed(2));push(r.lat,Math.round(j(224,20)));push(r.blat,Math.round(j(217,9)));
  r.left-=2;let stepped=false;
  if(r.left<=0){if(r.idx<r.steps.length-1){r.idx++;stepped=true;r.log.unshift([nowT(),"Lên "+r.steps[r.idx]+"%","đạt 3 vòng phân tích liền",I.ramp]);sync(r);}if(r.idx===r.steps.length-1){r.status="DONE";r.log.unshift([nowT(),"Hoàn tất","100% người dùng nhận bản mới",I.check]);}r.left=r.p.dwell;}
  const {p,q}=route();
  if(p.startsWith("/rollouts")&&q.get("id")==="ro-checkout"&&!$("#modal.on")&&!$("#pal.on")){
    if(stepped||r.status!=="RUNNING"){const s=$(".scroll")?.scrollTop;render();if($(".scroll"))$(".scroll").scrollTop=s;}
    else{const l=$("#left");if(l)l.textContent=r.left;const cur=$$(".seg2 i")[r.idx];if(cur)cur.style.width=Math.round((1-r.left/r.p.dwell)*100)+"%";
      $$("[data-chart]").forEach(el=>{if(!el.matches(":hover"))drawChart(el,r,el.dataset.chart);});}
  }
},2000);
window.addEventListener("resize",()=>{const r=RO(route().q.get("id"));if(r)$$("[data-chart]").forEach(el=>drawChart(el,r,el.dataset.chart));});

if(!location.hash)history.replaceState(null,"","#/overview");
render();
})();
</script>
</body></html>

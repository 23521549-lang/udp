global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: dev

scrape_configs:
  # Prometheus tự giám sát
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 3 service của UDP — chạy trên host, không trong container
  - job_name: udp-services
    static_configs:
      - targets:
          - host.docker.internal:3001 # core-backend
          - host.docker.internal:3002 # flag-service
          - host.docker.internal:3003 # pd-controller

  # Ứng dụng mẫu (`apps/sample-app`) — nguồn metrics cho flag-level progressive
  # delivery (C1). Middleware phát http_server_request_duration_seconds kèm MỘT
  # nhãn cố định `ff` mang chuỗi "<flagKey>=<variant>" (§6.6) — hook do provider
  # tự gắn. Middleware KHÔNG phát `namespace`: job này gắn nó [v4.8], và giá trị
  # PHẢI bằng environments.k8s_namespace của env mà SDK key thuộc về — mọi truy
  # vấn của S1/S3 lọc theo đó, thiếu thì probe và phân tích luôn rỗng. Ở đây là
  # env `dev` của project seed: k8sNamespaceFor("demo-service", <id seed>, "dev");
  # test `packages/design-lint/tests/prometheus-config.test.ts` giữ hai bên khớp.
  # `service_name` do app phát từ OTEL_SERVICE_NAME, PHẢI bằng workloadName của
  # rollout (mặc định `sample-app`).
  #
  # Hai instance: 3010 và 3011 — ô "lỗi chỉ ở một phần pod" của E5 bật chaos ở
  # MỘT instance (§13.4).
  - job_name: sample-app
    static_configs:
      - targets:
          - host.docker.internal:3010
          - host.docker.internal:3011
        labels:
          namespace: udp-demo-service-000000-dev

# Portal trong cluster (Plan #49). `core-backend` là Service Kubernetes cùng namespace.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # [Plan #60 QĐ-9] `/` là trang giới thiệu ĐÃ DỰNG SẴN (index.html: nội dung có trước khi JS chạy, tốt cho tìm
  # kiếm). Mọi đường khác không phải tệp tĩnh trả vỏ SPA app.html để router phía trình duyệt xử lý — không để trang
  # giới thiệu chớp lên trước màn /app.
  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri /app.html;
  }

  location /api/ {
    proxy_pass http://core-backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Luồng SSE của project (§10.14) — không đệm, không cắt kết nối rỗi sớm
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}

# Portal trong cluster (Plan #49). `core-backend` là Service Kubernetes cùng namespace.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # SPA: mọi đường không phải tệp tĩnh trả index.html để router phía trình duyệt xử lý
  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://core-backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Luồng SSE của project (§10.14) — không đệm, không cắt kết nối rỗi sớm
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}

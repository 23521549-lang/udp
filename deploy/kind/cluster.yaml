# Cụm kind của UDP (Plan #49) — một node, hai cổng ra máy: Portal 8080, Service 2 3002.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30002
        hostPort: 3002
        protocol: TCP

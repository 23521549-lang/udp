# Portal (Plan #49): tệp tĩnh + proxy /api sang Service 1 (deploy/docker/nginx.conf), nginx không root.
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: portal
          image: udp/portal
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false

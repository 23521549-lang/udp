# Service 3 — reconciler rollout, auto-rollback (Plan #49). Chạy mã nguồn bằng tsx (deploy/docker/service.Dockerfile, QĐ-1): startupProbe
# cho tsx thời gian biên dịch lúc khởi động; /readyz chỉ xanh khi database và danh tính role đã khẳng định.
apiVersion: v1
kind: Service
metadata:
  name: pd-controller
spec:
  selector:
    app.kubernetes.io/name: pd-controller
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pd-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pd-controller
    spec:
      enableServiceLinks: false # [Plan #63 QĐ-5] lý do ở base/core-backend.yaml
      # [Plan #67] ServiceAccount riêng: danh tính bên gọi `/internal/*` (TokenReview). Service 3 không gọi API server
      # của cụm UDP (token cụm khách xin qua Service 1), nên không gắn token mặc định - chỉ token chiếu bên dưới.
      serviceAccountName: pd-controller
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # [Plan #67] Token chiếu của ServiceAccount cho từng đích `/internal/*` mà service này gọi - audience theo đích
      # (`INTERNAL_AUDIENCE` của @udp/config/constants), kubelet xoay ở 80% thời hạn, đọc lại mỗi lời gọi
      volumes:
        - name: internal-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: udp:internal:core-backend
                  expirationSeconds: 3600
                  path: core-backend
              - serviceAccountToken:
                  audience: udp:internal:flag-service
                  expirationSeconds: 3600
                  path: flag-service
      containers:
        - name: pd-controller
          image: udp/pd-controller
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: udp-config
            - secretRef:
                name: udp-secrets
          volumeMounts:
            - name: internal-token
              mountPath: /var/run/secrets/udp/internal
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false

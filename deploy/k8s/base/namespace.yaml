apiVersion: v1
kind: Namespace
metadata:
  name: udp
  labels:
    # [Plan #67] Pod Security "baseline": không hostPath, hostNetwork, privileged trong namespace của UDP - nếu không, ai
    # tạo được pod ở đây đọc được tệp token chiếu của Service 3 qua thư mục pod của kubelet (k3s một node)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline

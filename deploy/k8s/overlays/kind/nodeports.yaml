# Portal ra cổng 8080 và Service 2 (SDK, OFREP) ra cổng 3002 của máy — deploy/kind/cluster.yaml
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: udp
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: udp
spec:
  type: NodePort
  ports:
    - name: http
      port: 3002
      targetPort: http
      nodePort: 30002

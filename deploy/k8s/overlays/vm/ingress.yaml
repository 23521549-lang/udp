# Bề mặt công khai DUY NHẤT (Plan #52 QĐ-5) — cùng bảng với `PUBLIC_ROUTES` của deploy/src/vm.ts (test canh).
# `/internal`, `/metrics`, probe và Prometheus không có route: những đường đó rơi vào Portal và nhận trang SPA.
# Chỉ trên HTTPS: Traefik biến một Ingress có `tls` thành router CHỈ nhận kết nối TLS — HTTP do Ingress `udp-http`
# bên dưới lo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: udp
  namespace: udp
  annotations:
    cert-manager.io/cluster-issuer: udp-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - udp.invalid
      secretName: udp-tls
  rules:
    - host: udp.invalid
      http:
        paths:
          # SPA + /api (nginx của Portal proxy sang Service 1, cùng origin — cookie httpOnly)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
          # SDK và OFREP trong ứng dụng của khách
          - path: /sdk
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  name: http
          - path: /ofrep
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  name: http
          # Discovery + JWKS mà cloud của khách đọc (federation GCP/Azure)
          - path: /oidc
            pathType: Prefix
            backend:
              service:
                name: core-backend
                port:
                  name: http
          # Gate mà Flagger trong cluster tenant hỏi trước mỗi bậc (§7.3)
          - path: /webhooks/flagger
            pathType: Prefix
            backend:
              service:
                name: pd-controller
                port:
                  name: http
---
# HTTP → HTTPS: mọi đường trên cổng 80 chuyển hướng vĩnh viễn. Route thử thách HTTP-01 mà cert-manager tự tạo cho
# Let's Encrypt có đường dài hơn `/` nên Traefik ưu tiên nó — chứng chỉ vẫn cấp được qua cổng 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: udp-http
  namespace: udp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: udp-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: udp.invalid
      http:
        paths:
          # Backend chỉ để Ingress hợp lệ — Middleware trả chuyển hướng trước khi request tới nó
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: udp
spec:
  redirectScheme:
    scheme: https
    permanent: true

# Hạ tầng dev. Mọi giá trị đọc từ .env ở cùng thư mục — không hardcode
# credential ở đây, để đổi mật khẩu chỉ phải sửa đúng một file.
# Cú pháp ${VAR:-default} giữ cho compose vẫn chạy được khi chưa có .env.
#
# ============================================================
# PostgreSQL KHÔNG còn ở đây — đã chuyển lên managed Postgres (Supabase).
# Cấu hình kết nối ở .env: cần HAI chuỗi, xem .env.example và §15.3.
#
# Hai hệ quả, ghi lại để không phát hiện muộn:
#
#   1. Test cần database DÙNG-MỘT-LẦN (tạo/thu hồi role, chuỗi migration) chạy
#      trên một database scratch dựng ngay trên Supabase (`pnpm test:scratch`,
#      §13.5) — cả ở máy dev lẫn CI.
#
#   2. Phép đo E4 (độ trễ lan truyền cấu hình) ở hình học CHÍNH THỨC chạy ở CI,
#      nơi database và ứng dụng cùng vùng. Trên máy cá nhân với database ở
#      Singapore, RTT mạng lấn át chính con số mà E4 định chứng minh — số đo ở
#      đó được ghi là dev-geometry (docs/measurements, [v4.8]).
#
# Prometheus vẫn chạy cục bộ vì C1 cần nó để phát triển, và nó nhẹ hơn Postgres
# nhiều: không có volume dữ liệu lớn, không có WAL, retention chỉ 7 ngày.
# ============================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: udp-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - udp-promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    extra_hosts:
      # Cho phép Prometheus trong container scrape service chạy trên máy host
      - "host.docker.internal:host-gateway"

volumes:
  udp-promdata:

name: Publish SDK (diễn tập)

# [Plan #62] Lượt chạy tay để kiểm một version TRƯỚC khi đẩy tag — và nó KHÔNG phát hành được gì.
#
# Vì sao là một tệp RIÊNG chứ không một `if:` trong `publish.yml`: cả npm lẫn PyPI ràng trusted publisher vào TÊN
# TỆP workflow, nên token OIDC của tệp này mang `workflow_ref` khác và hai registry từ chối. Đó là một tính chất
# do registry bảo đảm. Lớp thứ hai: tệp này không khai `id-token: write`, nên `npm publish --provenance` ném
# EUSAGE trước mọi lượt gửi.
#
# Và nó chỉ hứa đúng thứ nó chứng minh được. `npm publish --dry-run` KHÔNG diễn tập provenance (phần sinh
# provenance nằm sau nhánh `if (!dryRun)`) và cũng KHÔNG bắt `private: true` — nên thứ được khẳng định ở đây là:
# hai manifest khớp version mong đợi, build chạy, và artifact đạt hợp đồng.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version để đối chiếu với hai manifest (KHÔNG phát hành gì)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rehearse:
    name: diễn tập — version, build, hợp đồng artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Input đi qua `env:` chứ không nội suy thẳng vào `run:` (cùng khuôn I28_BASE/I28_HEAD của ci.yml), và nó
      # chỉ dùng để ĐỐI CHIẾU — không bao giờ để GHI version vào tệp nào.
      - name: hai manifest khớp version mong đợi
        env:
          WANT: ${{ inputs.version }}
        run: pnpm --filter @udp/design-lint exec tsx scripts/sdk-version.ts --expect "$WANT"

      - name: artifact npm đạt hợp đồng
        run: pnpm -C packages/openfeature-provider exec tsx scripts/pack.ts --out "$RUNNER_TEMP/pack"
      - run: npm publish "$RUNNER_TEMP/pack"/*.tgz --access public --dry-run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - name: artifact PyPI đạt hợp đồng
        working-directory: sdks/python
        run: |
          python -m pip install -e ".[dev]"
          python -m build
          python -m twine check --strict dist/*
          unzip -p dist/*.whl '*/METADATA' | grep -qx 'License-Expression: Apache-2.0'
          unzip -p dist/*.whl '*/METADATA' | grep -qx 'License-File: LICENSE'
          unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
          tar -tzf dist/*.tar.gz | grep -qE '/LICENSE$'
